<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="mr-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="mr-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#222238" stop-opacity="0.2" />
    </linearGradient>
    <filter id="mr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mr-bg)" stroke="url(#mr-border)" stroke-width="1.5" />
  <g filter="url(#mr-glow)">
    <text x="32" y="41" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="700" fill="url(#mr-accent)" text-anchor="middle" letter-spacing="1">MR</text>
  </g>
  <circle cx="49" cy="15" r="3" fill="#6366f1" />
</svg>